<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "CarburantRadar",
  "url": "https://emilienzabu.github.io/CarburantRadar/",
  "description": "CarburantRadar permet de comparer les prix du carburant dans les stations-service proches de l'utilisateur et de trouver les meilleurs prix pour Diesel, SP95, SP98, E10, E85 et GPL.",
  "applicationCategory": "UtilityApplication",
  "operatingSystem": "Any (Progressive Web App)"
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-page:#0a0a0f;
  --bg-surface:#16161f;
  --border:#252535;
  --text:#e8e8f0;
  --text-muted:#6b6b8a;
  --accent:#f5a623;
}
body{background:var(--bg-page);color:var(--text);font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.ico{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
h1{font-size:20px;font-weight:800;margin-bottom:6px}
h1 span{color:var(--accent)}
p{font-size:13px;color:var(--text-muted);margin-bottom:28px;max-width:340px}
.pays-liste{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.pays-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.pays-btn .drapeau{font-size:22px}
.pays-btn .defaut{margin-left:auto;font-size:10px;font-weight:700;color:#000;background:var(--accent);padding:3px 8px;border-radius:6px}
.pays-btn.desactive{opacity:.45;cursor:default;pointer-events:none}
.pays-btn.desactive .bientot{margin-left:auto;font-size:10px;color:var(--text-muted)}
footer{margin-top:32px;font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>
<img class="ico" src="icons/icon-192.png" alt="CarburantRadar" onerror="this.style.display='none'">
<h1>Carburant<span>Radar</span></h1>
<p>Choisis ton pays pour comparer les prix du carburant près de chez toi.</p>
<div class="pays-liste">
  <a class="pays-btn" href="france/" id="btnFrance"><span class="drapeau">🇫🇷</span> France <span class="defaut">Par défaut</span></a>
  <a class="pays-btn" href="espagne/" id="btnEspagne"><span class="drapeau">🇪🇸</span> Espagne</a>
  <div class="pays-btn desactive"><span class="drapeau">🇮🇹</span> Italie <span class="bientot">Bientôt disponible</span></div>
  <div class="pays-btn desactive"><span class="drapeau">🇵🇹</span> Portugal <span class="bientot">Bientôt disponible</span></div>
  <div class="pays-btn desactive"><span class="drapeau">🇩🇪</span> Allemagne <span class="bientot">Bientôt disponible</span></div>
</div>
<footer>CarburantRadar &middot; données publiques officielles</footer>
<script>
// Si l'utilisateur a déjà choisi un pays, on le renvoie directement dessus
try{
  var paysMemo=localStorage.getItem('cr_pays');
  if(paysMemo==='france')window.location.replace('france/');
  else if(paysMemo==='espagne')window.location.replace('espagne/');
}catch(e){}
document.getElementById('btnFrance').addEventListener('click',function(){
  try{localStorage.setItem('cr_pays','france');}catch(e){}
});
document.getElementById('btnEspagne').addEventListener('click',function(){
  try{localStorage.setItem('cr_pays','espagne');}catch(e){}
});
</script>
</body>
</html>
