name: Tester CarburantRadar Plus

on:
  pull_request:
    paths:
      - 'workers/plus/**'
      - 'france/plus.*'
      - 'france/index.html'
      - 'tests/plus_mobile.py'
      - '.github/workflows/test-plus.yml'

permissions:
  contents: read

jobs:
  plus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test workers/plus/test/plus.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/plus_mobile.py
