name: Relever les statistiques vidéo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: statistiques-video
  cancel-in-progress: false

jobs:
  collecte:
    if: vars.CR_STATS_ACTIVES == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Archiver les reçus et relever les compteurs
        run: python video/synchroniser_stats.py
        env:
          VIDEO_API_KEY: ${{ secrets.VIDEO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BRANCHE_PUBLICATION: ${{ github.event.repository.default_branch }}
