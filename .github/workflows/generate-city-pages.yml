name: Générer et déployer le site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'generator/**'
      - 'generate.py'
      - '.github/workflows/generate-city-pages.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'generate-pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'refs/heads/main' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identifier l’état utilisé pour la génération
        if: github.ref == 'refs/heads/main'
        id: generation-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Générer les pages (télécharge les prix officiels)
        run: python3 generate.py
        env:
          CR_INDEXNOW: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '1' || '0' }}

      - name: Préparer le site à publier
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=__pycache__ -cf - . | tar -xf - -C _site

      - name: Valider le site à publier (liens, canonical, sitemap, JSON-LD)
        run: |
          python3 generator/validate.py --root "$PWD/_site"
          cd _site
          python3 -B -m unittest discover -s tests -p test_twa_assetlinks.py -k AssetLinksPublication

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Préparer l’état du générateur
        if: github.ref == 'refs/heads/main'
        env:
          GENERATION_BASE: ${{ steps.generation-base.outputs.sha }}
        run: printf '%s\n' "$GENERATION_BASE" > generator/etat-generateur-base

      - name: Transmettre l’état au job de sauvegarde
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: etat-generateur
          path: |
            france/prix-carburant/history.json
            generator/generated_pages.json
            generator/etat-generateur-base
            SEO_REPORT.md
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  save-state:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: etat-generateur
          path: ${{ runner.temp }}/etat-generateur

      - name: Enregistrer l’historique et le manifeste
        run: python3 generator/save_published_state.py "$RUNNER_TEMP/etat-generateur"
