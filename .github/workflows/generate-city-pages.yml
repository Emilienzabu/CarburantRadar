name: Générer et déployer le site

on:
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'generate.py'
      - '.github/workflows/generate-city-pages.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit de l'état du générateur (historique, manifeste)
  pages: write      # déploiement GitHub Pages
  id-token: write

concurrency:
  group: generate-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les pages (télécharge les prix officiels)
        run: python3 generate.py

      - name: Valider (liens, canonical, sitemap, JSON-LD, orphelines)
        run: python3 generator/validate.py

      # On ne commit plus les ~1000 pages HTML : seulement l'état dont le générateur a besoin d'un run à l'autre.
      - name: Commit de l'état du générateur
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "État du générateur (historique des prix, manifeste)"
          file_pattern: 'france/prix-carburant/history.json generator/generated_pages.json SEO_REPORT.md'

      - name: Préparer le site à publier
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
