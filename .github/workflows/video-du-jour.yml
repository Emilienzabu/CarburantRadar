name: Vidéo du jour

on:
  schedule:
    # 2 publications par jour. Heures en UTC : 6h40 = 7h40 (hiver) / 8h40 (été) à Paris, publication environ 20 min plus tard.
    - cron: "40 6 * * *"    # matin
    - cron: "40 16 * * *"   # soir (17h40 hiver / 18h40 été)
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier sur YouTube et Instagram ? (décoché = génère seulement la vidéo à télécharger)"
        type: boolean
        default: false
      format:
        description: "Format (planning = celui prévu pour ce créneau)"
        type: choice
        options: [planning, ville, classement, astuce]
        default: planning
      creneau:
        description: "Créneau (auto = selon l'heure de Paris)"
        type: choice
        options: [auto, matin, soir]
        default: auto
      ville:
        description: "Ville (ex. marseille), pour le format ville. Vide = selon le planning"
        required: false
        default: ""
      carburant:
        description: "Carburant : gazole, e10, sp98, e85 ou gpl. Vide = selon le planning"
        required: false
        default: ""

concurrency:
  group: video-du-jour
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg et les dépendances
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
          pip install -r video/requirements.txt

      - name: Générer la vidéo (et la publier si demandé)
        env:
          VIDEO_API_KEY: ${{ secrets.VIDEO_API_KEY }}
          EVENEMENT: ${{ github.event_name }}
          PUBLIER: ${{ inputs.publier }}
          FORMAT: ${{ inputs.format }}
          CRENEAU: ${{ inputs.creneau }}
          VILLE: ${{ inputs.ville }}
          CARBURANT: ${{ inputs.carburant }}
        run: |
          ARGS=()
          if [ "$EVENEMENT" = "schedule" ] || [ "$PUBLIER" = "true" ]; then ARGS+=(--publier); fi
          if [ -n "$FORMAT" ] && [ "$FORMAT" != "planning" ]; then ARGS+=(--format "$FORMAT"); fi
          if [ -n "$CRENEAU" ]; then ARGS+=(--creneau "$CRENEAU"); fi
          if [ -n "$VILLE" ]; then ARGS+=(--ville "$VILLE"); fi
          if [ -n "$CARBURANT" ]; then ARGS+=(--carburant "$CARBURANT"); fi
          python video/generate_video.py "${ARGS[@]}"

      - name: Garder la vidéo pour la télécharger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-du-jour
          path: video/sortie/video-du-jour.mp4
          retention-days: 7
          if-no-files-found: ignore
