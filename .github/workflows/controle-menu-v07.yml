name: Contrôler le menu V07
on:
  push:
    branches: [codex/validation-menu-v07]
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install chromium
      - name: Tester les parcours du menu
        run: python tests/v07-smoke.py france/index.html
      - name: Vérifier la compatibilité avec le générateur
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "generator")
          from app_patches import patch_text
          fichier = Path("france/index.html").read_text(encoding="utf-8")
          nouveau, statut = patch_text("france", fichier)
          print(statut)
          assert nouveau is None and statut.startswith("déjà")
          PY
      - name: Vérifier le manifeste et les liaisons Android
        run: python tests/test_twa_assetlinks.py AssetLinksPublication NonRegressionPWA
