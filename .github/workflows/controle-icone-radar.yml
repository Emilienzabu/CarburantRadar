name: Vérifier l’icône Radar
on:
  push:
    branches: [codex/validation-contour-radar]
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.65.2 pillow
          python -m playwright install chromium
      - name: Contrôler l’icône sur mobile
        run: python tests/radar-smoke.py
