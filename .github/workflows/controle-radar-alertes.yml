name: Vérifier le Radar et les notifications
on:
  push:
    branches: [codex/validation-radar-alertes]
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester le clic du service worker
        run: node --test tests/notification-click.test.cjs
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install chromium
      - name: Vérifier le total et l’ouverture de la fiche en mobile
        run: python tests/radar-alertes-smoke.py
